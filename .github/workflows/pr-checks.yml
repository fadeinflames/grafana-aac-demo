# ============================================================================
#  Проверки на Pull Request.
#
#  Два job'а:
#   1. static-checks — всё, что НЕ требует доступа к Grafana (fmt, validate, tflint,
#      линтеры YAML/JSON, юнит-тесты модулей). Работает на обычном GitHub-раннере.
#   2. plan — `terraform plan` против стенда и комментарий с результатом в PR.
#      Нужен доступ к Grafana и к MinIO, поэтому идёт на раннере, который «видит»
#      стенд (self-hosted). См. docs/06-ci-setup.md.
# ============================================================================
name: PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - "alerts/**"
      - "dashboards/**"
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/**"

# Права токена GITHUB_TOKEN по умолчанию — только чтение кода.
# Что-то большее (комментарии в PR) выдаём отдельным job'ам ниже.
permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks (fmt / validate / lint / tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Новый коммит в тот же PR отменяет предыдущую проверку — экономим минуты.
    concurrency:
      group: pr-static-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Забираем код репозитория
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Версию Terraform берём из файла, чтобы она была одна для всех (CI и ноутбуки)
      - name: Read Terraform version
        id: tfv
        run: echo "version=$(cat terraform/envs/test/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfv.outputs.version }}
          terraform_wrapper: false

      # 1. Форматирование. Если упало: локально выполните `make fmt` и закоммитьте.
      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff terraform

      # 2. Синтаксис и ссылки между ресурсами. -backend=false: хранилище state не нужно.
      - name: terraform init (без backend)
        working-directory: terraform/envs/test
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: terraform/envs/test
        run: terraform validate

      # 3. Линтер Terraform: устаревший синтаксис, неиспользуемые переменные и т.п.
      - name: Install tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.63.1

      - name: tflint
        run: |
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --recursive --format compact

      # 4. Линтер YAML-алертов (стиль и синтаксис YAML)
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: yamllint (alerts/)
        run: |
          pip install --disable-pip-version-check yamllint==1.37.1
          yamllint --strict --config-file .yamllint.yml alerts

      # 5. JSON-дашборды: валидный JSON, есть uid, datasource по uid, нет __inputs
      - name: Validate dashboards
        run: python3 scripts/validate_dashboards.py

      # 6. Юнит-тесты модуля alert-rules: проверяют и реальные алерты из alerts/*.yaml
      #    (смысловые ошибки: severity, threshold, формат for...), и то, что
      #    плохие YAML отклоняются. Grafana для них не нужна (provider замокан).
      - name: terraform test (alert-rules)
        working-directory: terraform/modules/alert-rules
        run: |
          terraform init -backend=false -input=false
          terraform test

  plan:
    name: terraform plan (stand)
    needs: static-checks
    # PR из форка НЕ должен запускаться на нашем раннере: чужой код получил бы
    # доступ к стенду и секретам.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # По умолчанию — наш self-hosted раннер. Если стенд доступен иначе (туннель, Grafana Cloud),
    # задайте переменную репозитория STAND_RUNNER_LABELS = ["ubuntu-24.04"].
    runs-on: ${{ fromJSON(vars.STAND_RUNNER_LABELS || '["self-hosted","grafana-aac-stand"]') }}
    timeout-minutes: 15
    # Один общий «замок» на всё, что трогает стенд: plan, apply и drift идут по очереди.
    concurrency:
      group: terraform-test-stand
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # нужно только чтобы написать комментарий с планом
    env:
      # Адреса — не секреты, хранятся в Variables. Токены и пароли — в Secrets.
      GRAFANA_URL: ${{ vars.GRAFANA_URL }}
      AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
      GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      CHECKPOINT_DISABLE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: tfv
        run: echo "version=$(cat terraform/envs/test/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfv.outputs.version }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: terraform/envs/test
        run: terraform init

      # plan сохраняем в файл plan.txt, чтобы потом вставить в комментарий.
      # -detailed-exitcode: 0 = изменений нет, 2 = изменения есть (это НЕ ошибка), 1 = ошибка.
      - name: terraform plan
        id: plan
        working-directory: terraform/envs/test
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      # Публикуем план комментарием в PR (один комментарий, обновляется при новых коммитах).
      - name: Comment plan in PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-comment -->';
            let plan = fs.readFileSync('terraform/envs/test/plan.txt', 'utf8');
            // Комментарий в GitHub ограничен 65 536 символами — оставляем запас.
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (план обрезан, полный текст — в логе job\'а)';
            const status = process.env.PLAN_EXITCODE === '2'
              ? 'Есть изменения (см. ниже). Они применятся автоматически после merge в `main`.'
              : 'Изменений нет: Grafana уже соответствует коду.';
            const body = `${marker}\n### Terraform plan (тестовый стенд)\n${status}\n\n<details><summary>Показать план</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\nКоммит: ${context.sha.slice(0, 7)}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
